services:
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # prometheus exporter (prometheus scrapes localhost:8889)
    volumes:
      - ./otel-config.yaml:/etc/otel/config.yaml:ro
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      - GOGC=80
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: prometheus
    network_mode: host
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    restart: unless-stopped

  loki:
    image: docker.io/grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-storage:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  tempo:
    image: docker.io/grafana/tempo:latest
    container_name: tempo
    ports:
      - "3200:3200"   # query API (Grafana datasource)
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-storage:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: grafana
    network_mode: host
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  promtail:
    image: docker.io/grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      # NOTE: host paths are laptop-specific — parameterize when scripting (Builder)
      - /home/b0llull0s/.hermes/logs:/var/log/hermes:ro
      - /home/b0llull0s/.hermes/profiles:/var/log/hermes-profiles:ro
      - promtail-positions:/data
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  prometheus-storage:
  loki-storage:
  tempo-storage:
  grafana-storage:
  promtail-positions: