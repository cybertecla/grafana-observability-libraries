# Loki single-node (official example shape) — sqlite kvstore, no exotic keys
auth_enabled: false

# Loki throttles ALL writes when the WAL's filesystem passes 90% — this box
# sits at ~91-97% (home partition), which wedged the ingester ("Ingester is
# shutting down" on every push). 0.98 keeps protection against a truly full
# disk while letting writes flow at current usage.
ingester:
  wal:
    disk_full_threshold: 0.98

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: false

server:
  http_listen_port: 3100
  log_level: info