groups:
  - name: hermes_cost
    rules:
      - alert: DailyCostBudgetExceeded
        expr: hermes_cost_usd_daily > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenRouter daily spend above $2"
          description: "Daily usage is currently ${{ $value }}."

      - alert: CostExporterDown
        expr: up{job="hermes-cost-exporter"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Hermes cost exporter target is down"
          description: "Prometheus cannot scrape the cost exporter — cost visibility is blind."

      - alert: CostExporterStale
        expr: time() - hermes_cost_last_success_timestamp_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cost exporter has not polled successfully in 15m"
          description: "The exporter is running but OpenRouter polling is failing."
