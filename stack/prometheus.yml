global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'hermes-cost-exporter'
    static_configs:
      - targets: ['localhost:9101']

  - job_name: 'hermes-flow-exporter'
    static_configs:
      - targets: ['localhost:9102']