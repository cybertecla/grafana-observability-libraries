server:
  http_listen_port: 9080

positions:

  filename: /data/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: hermes-root-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: hermes
          source: root
          __path__: /var/log/hermes/*.log*
  - job_name: hermes-profile-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: hermes
          source: profile
          __path__: /var/log/hermes-profiles/*/logs/*.log*